name: Deploy SendCrypto.io

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx astro check

      - name: Build Astro site
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_SITE_URL: https://sendcrypto.io
        run: npm run build

      - name: Security check — scan for leaked secrets
        run: |
          if grep -r "eyJhbGciOi" ./dist/ 2>/dev/null; then
            echo "ERROR: Supabase JWT found in build output"
            exit 1
          fi
          if grep -r "service_role" ./dist/ 2>/dev/null | grep -v ".map"; then
            echo "ERROR: service_role reference in build output"
            exit 1
          fi
          echo "Security scan passed."

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: sendcrypto
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Ping search engines
        if: github.ref == 'refs/heads/main'
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://sendcrypto.io/sitemap.xml" || true
          curl -s "https://www.bing.com/ping?sitemap=https://sendcrypto.io/sitemap.xml" || true
